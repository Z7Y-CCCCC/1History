<!DOCTYPE html>
<html lang="zh-CN" class="notranslate">
<head>
  <meta name="google" content="notranslate">
  <meta name="microsoft" content="notranslate">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/static/img/history.ico">
  <title>1History Details</title>
  <link rel="stylesheet" href="../src/style.css">
</head>
<body>
  <nav>
    <div style="display:flex;align-items:center;gap:16px">
      <a class="nav-brand" href="/">1History</a>
      <a href="#" class="btn-outline" style="text-decoration:none;font-size:12px" data-i18n="nav.yesterday">← Yesterday</a>
      <span style="font-weight:600">2026-04-25</span>
      <a href="#" class="btn-outline" style="text-decoration:none;font-size:12px" data-i18n="nav.tomorrow">Tomorrow →</a>
    </div>
    <div style="display:flex;align-items:center;gap:10px">
      <input id="keyword" type="search" placeholder="Filter..." data-i18n-placeholder="nav.filter_placeholder"
        style="padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);font-size:13px">
      <button class="btn" id="submit" data-i18n="nav.search_btn">Search</button>
      <span id="details-count" style="color:var(--text-muted);font-size:13px">0 results</span>
      <button id="lang-toggle" class="btn-outline" style="font-size:12px;padding:4px 8px" title="Language">中文</button>
      <button id="theme-toggle" class="btn-outline" title="Toggle theme">🌙</button>
    </div>
  </nav>

  <div style="padding:24px;max-width:1200px;margin:0 auto">
    <div class="card" style="padding:0;overflow:hidden">
      <table>
        <thead><tr><th style="width:120px" data-i18n="table.time">Time</th><th data-i18n="table.title">Title</th></tr></thead>
        <tbody>
          <tr>
            <td style="white-space:nowrap;color:var(--text-muted)">14:20:00</td>
            <td><a href="https://example.com">Example page</a></td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script type="module" src="../src/details.js"></script>
</body>
</html>
